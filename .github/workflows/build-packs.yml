name: Build & publish pet packs

# 全流水线自包含：**仓库不入库任何二进制**。
#   npm registry 拉 dsh-pet 发布包（内含 assets/webm，约 53MB）
#     → ffmpeg 抠黑转动画 WebP（三档）
#     → zip(store) 打包
#     → index.json + 三个 zip 直传 Release（附件单文件上限 2GB，最大档约 0.5GB，无需分卷）
#
# 触发：push tag v*；或手动 workflow_dispatch（可改档位，不上传 Release）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      specs:
        description: "输出档位，逗号分隔：<宽度>x<帧率>"
        default: "300x15,480x24,640x24"
      quality:
        description: "webp 质量 0~100"
        default: "60"
      dry_run:
        description: "只构建不上传 Release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PET_SRC: dsh-pet-src
      # 桌面版发布包版本：升级素材时改这里即可
      PET_VERSION: 0.3.8
    steps:
      - name: Checkout asset repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch dsh-pet source assets from npm
        # 发布包里含 assets/webm + assets/config.jsonc + fonts/memes/pic，
        # 因此流水线不依赖任何其它仓库或私有凭据。
        run: |
          set -euo pipefail
          mkdir -p "$PET_SRC"
          curl -fsSL "https://registry.npmjs.org/dsh-pet/-/dsh-pet-${PET_VERSION}.tgz" -o pet-src.tgz
          tar -xzf pet-src.tgz -C "$PET_SRC" --strip-components=1
          test -d "$PET_SRC/assets/webm" || { echo "素材缺失：包里没有 assets/webm"; exit 1; }
          echo "webm 数量: $(ls "$PET_SRC/assets/webm" | wc -l)"
          du -sh "$PET_SRC/assets/webm"

      - name: Ensure ffmpeg supports libwebp
        # ubuntu 镜像自带的 ffmpeg 通常已启用 libwebp，但不同 runner 版本不保证；
        # 缺失时先回落到 apt 包，再回落到静态构建，避免耗时的转码跑到一半才炸。
        # 注意：这里不能用 `ffmpeg -encoders | grep -q` —— grep -q 提前关闭管道会让
        # ffmpeg 收到 SIGPIPE 退出，在 set -o pipefail 下被误判成"不支持 libwebp"。
        # 因此先取到变量再用 here-string 匹配（无管道参与）。
        run: |
          set -euo pipefail
          has_libwebp() {
            command -v ffmpeg >/dev/null 2>&1 || return 1
            local enc
            enc="$(ffmpeg -hide_banner -encoders 2>/dev/null || true)"
            grep -q "libwebp" <<< "$enc"
          }
          if has_libwebp; then echo "OK: 系统 ffmpeg 支持 libwebp"; exit 0; fi
          echo "系统 ffmpeg 缺 libwebp，尝试 apt 安装…"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if has_libwebp; then echo "OK: apt ffmpeg 支持 libwebp"; exit 0; fi
          echo "回落到 johnvansickle 静态构建…"
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffstatic.tar.xz
          tar -xf ffstatic.tar.xz
          STATIC_DIR="$(pwd)/$(tar -tf ffstatic.tar.xz | grep -m1 '^[^/]*/ffmpeg$' | xargs dirname)"
          echo "$STATIC_DIR" >> "$GITHUB_PATH"
          export PATH="$STATIC_DIR:$PATH"
          command -v ffmpeg
          has_libwebp || { echo "ffmpeg 仍不支持 libwebp"; exit 1; }

      - name: Build three specs
        # 不使用 actions/cache：三档产物合计约 1GB，会吃掉仓库 10GB 缓存配额的大头，
        # 且同一 key 在两次运行并发时会出现 "Unable to reserve cache" 直接失败。
        # 每次发版本来就是全新全量转码，命中率也低，收益不抵风险。
        run: |
          set -euo pipefail
          FF="${STATIC_FFMPEG:-ffmpeg}"
          # 静态包只有 ffmpeg，没有 ffprobe；系统 ffprobe 始终存在且够用
          PROBE="$(command -v ffprobe || true)"
          python tools/build-webp.py \
            --src "$PET_SRC" \
            --out build \
            --specs "${{ inputs.specs || '300x15,480x24,640x24' }}" \
            --quality "${{ inputs.quality || '60' }}" \
            --jobs 4 \
            --ffmpeg "$FF" \
            ${PROBE:+--ffprobe "$PROBE"}

      - name: Guard: animated WebP alpha sanity
        # 回归防护：ffmpeg 的 yuva420p → libwebp 路径会把海量 alpha=0 错写成
        # alpha=1，Android 渲染成灰底框（Chrome 上看不出来）。转码必须走 bgra。
        # 这里抽检每档若干文件的中间帧，alpha==1 占比超过 5% 即判失败。
        run: |
          set -euo pipefail
          pip install --quiet pillow numpy
          python - <<'PY'
          import glob, io, random, sys
          import numpy as np
          from PIL import Image
          random.seed(42)
          files = sorted(glob.glob('build/*/webp/*.webp'))
          assert files, 'build 下没有 webp 产物'
          sample = random.sample(files, min(9, len(files)))
          for f in sample:
              im = Image.open(f)
              im.seek(im.n_frames // 2)
              a = np.asarray(im.convert('RGBA'))[:, :, 3]
              frac = float((a == 1).mean())
              print(f"{f}: alpha==1 占比 {frac:.4f}")
              assert frac < 0.05, f"{f}: alpha==1 占比 {frac:.2%} ≥ 5%，疑似 yuva420p 路径回归"
          print('alpha 体检通过:', len(sample), '个文件')
          PY

      - name: Zip packs & build index
        run: |
          set -euo pipefail
          python tools/build-index.py --build-root build --out packs --index index.json
          ls -lh packs
          # 索引里的 url 必须是**裸附件名**：Release 附件平铺在同一层，
          # 写成 "packs/x.zip" 会被 App 拼成 .../download/packs/x.zip 而 404。
          python - <<'PY'
          import json, pathlib, sys
          d = json.load(open('index.json', encoding='utf-8'))
          assert len(d['packs']) >= 1, '索引为空'
          zips = {p.name for p in pathlib.Path('packs').glob('*.zip')}
          for p in d['packs']:
              u = p['url']
              assert '/' not in u, f"{p['id']}: url 不能带目录前缀（{u}）"
              assert u in zips, f"{p['id']}: url {u} 与产出 zip 不匹配 {sorted(zips)}"
          print('url 校验通过:', [p['url'] for p in d['packs']])
          PY

      - name: Summarize sizes
        run: |
          python - <<'PY'
          import json, pathlib
          rows = []
          for p in json.load(open('index.json', encoding='utf-8'))['packs']:
            mb = p['size'] / 1024 / 1024
            rows.append(f"| {p['id']} | {p.get('width')}×{p.get('height')} @{p['fps']}fps | "
                        f"{p['animations']} | {mb:.1f} MB |")
          total = sum(p['size'] for p in json.load(open('index.json', encoding='utf-8'))['packs']) / 1024 / 1024
          out = pathlib.Path('summary.md')
          out.write_text(
              "| 资源包 | 规格 | 动画数 | 体积 |\n|---|---|---|---|\n"
              + "\n".join(rows) + f"\n\n合计 **{total:.1f} MB**（Release 单文件上限 2GB，未分卷）\n",
              encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: |
            index.json
            packs/*.zip
          fail_on_unmatched_files: true

      - name: Upload build artifacts (dry run / dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pet-packs
          path: |
            index.json
            packs/*.zip
          retention-days: 3
